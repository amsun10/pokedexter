<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <radialGradient id="redGrad" cx="35%" cy="30%" r="65%">
      <stop offset="0%" stop-color="#ff4b55"/>
      <stop offset="60%" stop-color="#dc0a2d"/>
      <stop offset="100%" stop-color="#99001a"/>
    </radialGradient>
    <radialGradient id="whiteGrad" cx="35%" cy="30%" r="65%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="70%" stop-color="#e2e8f0"/>
      <stop offset="100%" stop-color="#94a3b8"/>
    </radialGradient>
    <radialGradient id="btnGrad" cx="35%" cy="35%" r="60%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#cbd5e1"/>
    </radialGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#000000" flood-opacity="0.4"/>
    </filter>
  </defs>
  <!-- Outer Rim / Shell -->
  <circle cx="50" cy="50" r="48" fill="#18181b" stroke="#09090b" stroke-width="2"/>
  <!-- Top Half Red -->
  <path d="M 4 50 A 46 46 0 0 1 96 50 Z" fill="url(#redGrad)" />
  <!-- Gloss highlight on top red -->
  <ellipse cx="50" cy="24" rx="28" ry="12" fill="white" opacity="0.25" />
  <!-- Bottom Half White -->
  <path d="M 4 50 A 46 46 0 0 0 96 50 Z" fill="url(#whiteGrad)" />
  <!-- Center Black Band -->
  <rect x="3" y="45" width="94" height="10" fill="#18181b" />
  <!-- Center Outer Ring -->
  <circle cx="50" cy="50" r="16" fill="#18181b" stroke="#09090b" stroke-width="1"/>
  <!-- Center Silver Ring -->
  <circle cx="50" cy="50" r="12" fill="#e2e8f0" />
  <!-- Center Button -->
  <circle cx="50" cy="50" r="8" fill="url(#btnGrad)" stroke="#64748b" stroke-width="1.5" filter="url(#shadow)"/>
</svg>